name: 生成并发布 AI 工具目录

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 01:00（北京时间 09:00）自动运行
  workflow_dispatch:      # 也支持在 GitHub 网页手动点一下立即运行

permissions:
  contents: write        # 允许把生成结果提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行生成器
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python generate.py

      - name: 提交生成的页面
        run: |
          git config user.name "ai-directory-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "无新内容，跳过提交"
          else
            git commit -m "auto: 更新目录 $(date +%F)"
            git push
          fi
